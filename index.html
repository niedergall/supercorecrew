  if(!o.onGround&&boxHit(o.x,o.y+1,o.w,o.h))o.onGround=true;
}
function unstick(o){if(!boxHit(o.x,o.y,o.w,o.h))return;for(let d=1;d<=10;d++)for(const [ax,ay] of [[0,-1],[0,1],[-1,0],[1,0]])if(!boxHit(o.x+ax*d,o.y+ay*d,o.w,o.h)){o.x+=ax*d;o.y+=ay*d;return}}
function burst(x,y,n,col,spd,life,grav,size=1){for(let i=0;i<n&&parts.length<700;i++){const a=Math.random()*6.28,s=rr(.2,1)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.3,t:0,life:life*rr(.6,1.2),g:grav,c:col,s:size})}}
function ftext(x,y,s,c='#fff'){texts.push({x,y,s,c,t:0})}
function say(s,c='#ffd23a',t=3){banner={s,c,t}}
function shake(a){cam.shake=Math.min(8,Math.max(cam.shake,a))}
function targets(){const a=[];for(const s of slots)if(s.active&&s.p&&s.p.state==='foot')a.push(s.p);a.push(rig);return a}
function inZone(b,x,y){return x>b.z0&&x<b.z1&&y>SURF*TS-44&&y<SURF*TS+10}

// ===================== TILES / MINING =====================
function damageTile(tx,ty,amt,src){if(tx<0||ty<0||tx>=WT||ty>=HT)return false;const i=ty*WT+tx,t=T[i];if(!SOLID[t]||t===7)return false;let e=prog.get(i);if(!e){e={p:0,t:0};prog.set(i,e)}e.p+=amt/hardOf(i);e.t=0;if(e.p>=1){breakTile(tx,ty,src);return true}return false}
function breakTile(tx,ty,src){
  if(tx<0||ty<0||tx>=WT||ty>=HT)return;const i=ty*WT+tx,t=T[i];if(t===0||t===7||t===8||t===10||t===11)return;const ore=O[i],px=tx*TS+8,py=ty*TS+8,ly=Lr[i];
  T[i]=0;O[i]=0;prog.delete(i);
  if(t===9){booms.push({x:px,y:py,t:.08,gas:true});return}
  burst(px,py,7,LAYERS[ly].c[3],55,.5,220,2);burst(px,py,5,LAYERS[ly].c[0],40,.6,220,2);
  if(ore){const hv=ORE[ore].heavy||0;
    if(!hv&&src==='rig'&&addCargo(ore)){Snd.pick(ore);ftext(px,py-6,'+'+ORE[ore].n+' '+fmt(ORE[ore].v),ORE[ore].c[1]);flyers.push({x:px,y:py,ore,t:0})}
    else{if(src==='rig'&&!hv)ftext(px,py-6,'CARGO FULL','#ff7a7a');items.push({x:px,y:py,vx:rr(-30,30),vy:-60,ore,w:hv?8:5,h:hv?8:5,t:0,heavy:hv})}}
  wake(tx,ty-1);
}
function wake(tx,ty){if(tileAt(tx,ty)===12&&!SOLID[tileAt(tx,ty+1)]&&!wakeQ.some(q=>q.x===tx&&q.y===ty))wakeQ.push({x:tx,y:ty,t:.4})}
function updFalling(dt){
  for(let k=wakeQ.length-1;k>=0;k--){const q=wakeQ[k];q.t-=dt;if(q.t<=0){wakeQ.splice(k,1);if(tileAt(q.x,q.y)===12&&!SOLID[tileAt(q.x,q.y+1)]){T[q.y*WT+q.x]=0;falling.push({x:q.x*TS+8,y:q.y*TS+8,vy:0});wake(q.x,q.y-1);shake(2);Snd.crumble()}}}
  for(let k=falling.length-1;k>=0;k--){const f=falling[k];f.vy=Math.min(300,f.vy+500*dt);f.y+=f.vy*dt;let dead=false;
    for(const o of targets()){if(Math.abs(o.x-f.x)<(o.w+14)/2&&Math.abs(o.y-f.y)<(o.h+14)/2){if(o===rig)hurtRig(14,'rock');else hurtPlayer(o,22);dead=true}}
    for(const c of creatures)if(Math.abs(c.x-f.x)<(c.w+14)/2&&Math.abs(c.y-f.y)<(c.h+14)/2){hitC(c,28,true);dead=true}
    if(!dead){const tx=Math.floor(f.x/TS),ty=Math.floor(f.y/TS);if(SOLID[tileAt(tx,Math.floor((f.y+8)/TS))]){dead=true;if(tileAt(tx,ty)===0){T[ty*WT+tx]=12}}}
    if(dead){burst(f.x,f.y,8,'#8a8a94',60,.5,200,2);Snd.crumble();shake(1.5);falling.splice(k,1)}}
}
function updBooms(dt){
  for(let k=booms.length-1;k>=0;k--){const b=booms[k];b.t-=dt;if(b.t>0)continue;booms.splice(k,1);const R=b.gas?46:32;
    Snd.boom(b.gas);shake(b.gas?6:3.5);flashes.push({x:b.x,y:b.y,r:R*2.2,t:.35});burst(b.x,b.y,22,'#ffb030',120,.6,60,2);burst(b.x,b.y,12,'#ff5a1a',90,.7,40,3);burst(b.x,b.y,10,'#3a3a3a',50,1,-20,3);
    const tx0=Math.floor((b.x-R)/TS),tx1=Math.floor((b.x+R)/TS),ty0=Math.floor((b.y-R)/TS),ty1=Math.floor((b.y+R)/TS);
    for(let y=ty0;y<=ty1;y++)for(let x=tx0;x<=tx1;x++){if(Math.hypot(x*TS+8-b.x,y*TS+8-b.y)<R&&SOLID[tileAt(x,y)]&&tileAt(x,y)!==7)breakTile(x,y,'boom')}
    const fo=(d)=>Math.max(0,1-d/(R+10));
    for(const o of targets()){const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<R+10){if(o===rig)hurtRig(30*fo(d),'boom');else hurtPlayer(o,38*fo(d))}}
    for(const c of creatures.slice()){const d=Math.hypot(c.x-b.x,c.y-b.y);if(d<R+10)hitC(c,70*fo(d),true)}
    if(b.gas)for(const s of slots)if(s.p&&s.p.state==='down'){const d=Math.hypot(s.p.x-b.x,s.p.y-b.y);if(d<R)s.p.downT-=10}}
}

// ===================== DAMAGE =====================
function hurtRig(d,why){if(d<=0||rig.hull<=0)return;rig.hull-=d;rig.flash=.15;shake(why==='lava'?.6:2.5);if(rig.hs<=0){Snd.hull();rig.hs=why==='lava'?.4:.1}if(rig.hull<=0){burst(rig.x,rig.y,30,'#ffb030',120,.8,60,2);rescue('HULL BREACH')}}
function hurtPlayer(p,d){if(!p||p.state==='down')return;if(p.state!=='foot'){hurtRig(d*.7,'p');return}if(p.inv>0)return;p.hp-=d;p.inv=.3;p.flash=.15;Snd.hurt();burst(p.x,p.y,5,'#ff4a4a',50,.4,200);if(p.hp<=0){p.hp=0;p.state='down';p.downT=30;p.vx=0;p.carry=[];Snd.down();ftext(p.x,p.y-12,'DOWN!','#ff5a5a');say('PLAYER '+(p.slot+1)+' IS DOWN - HOLD USE TO REVIVE','#ff8a8a',2.5)}}
function hitC(c,dmg,quiet){const D=CT[c.type];dmg=Math.max(1,dmg-(D.armor||0));c.hp-=dmg;c.flash=.08;if(!quiet)Snd.hit();burst(c.x,c.y,3,'#ffe08a',40,.3,100);if(c.hp<=0)killC(c)}
function killC(c){const k=creatures.indexOf(c);if(k<0)return;creatures.splice(k,1);const D=CT[c.type];G.cash+=D.bounty;G.kills++;ftext(c.x,c.y-10,'+$'+D.bounty,'#ffe070');burst(c.x,c.y,D.boss?60:14,'#ffe08a',D.boss?160:80,.8,120,2);Snd.kill(D.boss);
  if(D.boss){G.bossDead[c.bi]=true;shake(8);const loot=c.bi===0?[6,6,7,10]:c.bi===1?[7,7,8,8,11]:[8,8,9,9,9,11,11];for(const m of loot)items.push({x:c.x+rr(-14,14),y:c.y-6,vx:rr(-50,50),vy:-120,ore:m,w:ORE[m].heavy?8:5,h:ORE[m].heavy?8:5,t:0,heavy:ORE[m].heavy||0});say(D.name+' DEFEATED! +'+fmt(D.bounty),'#ffd23a',5);save()}}
function rescue(why){
  const dr=depthRows(),fee=dr>3?Math.round(250+dr*1.5):0;G.cash-=fee;rig.cargo=[];rig.x=SPAWN_X;rig.y=SURF*TS-7;rig.vx=rig.vy=0;rig.fuel=Math.max(rig.fuel,25);rig.hull=Math.max(rig.hull,maxHull()*.4);rig.heat=0;rig.over=false;rig.strand=0;
  for(const s of slots)if(s.p){const p=s.p;p.carry=[];p.o2=o2Max();if(p.state==='down'||p.state==='foot'){p.hp=Math.max(p.hp,50);boardNew(p)}}
  creatures=creatures.filter(c=>CT[c.type].boss);Snd.rescue();shake(4);say(fee?why+' - TOWED TO SURFACE. FEE '+fmt(fee):why+' - TOWED TO STATION','#ffb02e',4);save()}

// ===================== LASER =====================
function fireLaser(ox,oy,ang,range,dmg,col,hand){
  const dx=Math.cos(ang),dy=Math.sin(ang);let x=ox,y=oy,hit=null;
  for(let l=0;l<range;l+=2){x=ox+dx*l;y=oy+dy*l;const tx=Math.floor(x/TS),ty=Math.floor(y/TS),t=tileAt(tx,ty);if(SOLID[t]){if(t===9)breakTile(tx,ty,'laser');burst(x,y,2,'#ffe08a',30,.25,100);break}
    for(const c of creatures)if(Math.abs(x-c.x)<c.w/2+1&&Math.abs(y-c.y)<c.h/2+1){hit=c;break}if(hit)break}
  beams.push({x1:ox,y1:oy,x2:x,y2:y,t:.07,c:col,big:!hand});if(hit)hitC(hit,dmg);hand?Snd.hand():Snd.turret(rig.heat)}

// ===================== RIG =====================
function updRig(dt){
  const r=rig,drv=r.driver>=0?slots[r.driver]:null,inp=drv&&drv.p?drv.inp:null;
  r.flash=Math.max(0,r.flash-dt);r.hs-=dt;const hasFuel=r.fuel>0;
  let dx=0,up=false,down=false;if(inp&&hasFuel){dx=(inp.held.right?1:0)-(inp.held.left?1:0);up=inp.held.up;down=inp.held.down}
  const tm_=upVal('thr');r.vy+=300*dt;r.thrust=0;
  if(up){r.vy-=(300+300*tm_)*dt;r.fuel-=1.6*dt;r.thrust=1}
  if(dx){r.vx+=dx*(r.onGround?700:380)*dt;r.face=dx}else r.vx-=Math.sign(r.vx)*Math.min(Math.abs(r.vx),(r.onGround?500:70)*dt);
  const mx=85+25*tm_;r.vx=clamp(r.vx,-mx,mx);r.vy=clamp(r.vy,-(90+40*tm_),150);
  if(inp&&hasFuel)r.fuel-=.1*dt;
  r.drilling=false;r.dtx=-1;let tx=0,ty=0,ddx=0,ddy=0,tgt=false;
  if(inp&&hasFuel){
    if(down&&!up&&r.onGround){ddy=1;tx=Math.floor(r.x/TS);ty=Math.floor((r.y+r.h/2+1)/TS);tgt=true}
    else if(dx&&!up){ddx=dx;tx=Math.floor((r.x+dx*(r.w/2+1))/TS);ty=Math.floor(r.y/TS);tgt=true}
    if(tgt){const t=tileAt(tx,ty);if(SOLID[t]&&t!==7){
      r.drilling=true;r.dtx=tx;r.dty=ty;r.ddir=ddy?3:(ddx>0?0:2);r.fuel-=(.6+.35*LAYERS[Lr[ty*WT+tx]].hard)*dt;r.spin+=dt*30;
      if(ddy){const cxp=tx*TS+8;const nx=r.x+clamp(cxp-r.x,-80*dt,80*dt);if(!boxHit(nx,r.y,r.w,r.h))r.x=nx;r.vx=0;r.vy=Math.max(r.vy,0)}
      else{const cyp=ty*TS+8;if(Math.abs(cyp-r.y)<8){const ny=r.y+clamp(cyp-r.y,-80*dt,80*dt);if(!boxHit(r.x,ny,r.w,r.h))r.y=ny}r.vx=ddx*25}
      if(damageTile(tx,ty,2.4*upVal('drill')*dt,'rig')){}
      if(Math.random()<.5){const hx=tx*TS+8-ddx*8-(ddy?0:0),hy=ty*TS+8-ddy*8;burst(hx,hy,1,LAYERS[Lr[ty*WT+tx]].c[3],40,.3,200)}
      if(Math.random()<.08)Snd.crumble()}}}
  moveBox(r,dt);
  if(r.hy>0&&r.iy>130&&inp!==undefined){hurtRig((r.iy-130)*.35,'fall');r.iy=0}
  unstick(r);
  if(tileAt(Math.floor(r.x/TS),Math.floor(r.y/TS))===8)hurtRig(14*dt,'lava');
  if(r.thrust&&Math.random()<.7)parts.push({x:r.x+rr(-3,3),y:r.y+7,vx:rr(-15,15),vy:rr(40,90),t:0,life:.3,g:0,c:Math.random()<.5?'#ffb02e':'#ff6a1a',s:2});
  if(r.onGround&&Math.abs(r.vx)>25&&Math.random()<.35)parts.push({x:r.x-Math.sign(r.vx)*6+rr(-1,1),y:r.y+6,vx:rr(-10,10)-Math.sign(r.vx)*20,vy:rr(-20,-5),t:0,life:.4,g:20,c:'rgba(180,160,130,.6)',s:2});
  if(inp&&hasFuel&&Math.random()<.12)parts.push({x:r.x-5,y:r.y-6,vx:rr(-8,2),vy:rr(-25,-12),t:0,life:.6,g:-10,c:'rgba(90,90,100,.6)',s:2});
  r.heat=Math.max(0,r.heat-28*upVal('cool')*dt);if(r.heat>=100&&!r.over){r.over=true;Snd.overheat();ftext(r.x,r.y-16,'OVERHEAT','#ff6a4a')}if(r.over&&r.heat<35)r.over=false;
  r.cd-=dt;
  if(r.fuel<0)r.fuel=0;
  if(r.fuel<=0){r.strand+=dt;if(r.strand>8)rescue('OUT OF FUEL')}else r.strand=0;
  alarmT-=dt;if(alarmT<=0&&(r.fuel<maxFuel()*.15||r.hull<maxHull()*.25)&&(r.driver>=0||r.gunner>=0)){alarmT=.9;Snd.beep()}
  Snd.engine(r.driver>=0&&r.fuel>0,r.thrust,r.drilling,r.drilling?LAYERS[Lr[clamp(ty,0,HT-1)*WT+clamp(tx,0,WT-1)]].hard:0);
}
function turret(p,inp,dt){
  let a=null;if(inp.aim)a=Math.atan2(inp.ay,inp.ax);else{const dx=(inp.held.right?1:0)-(inp.held.left?1:0),dy=(inp.held.down?1:0)-(inp.held.up?1:0);if(dx||dy)a=Math.atan2(dy,dx)}
  if(a!==null){let d=a-rig.aim;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;const m=10*dt;rig.aim+=clamp(d,-m,m)}
  if(inp.held.fire&&!rig.over&&rig.cd<=0){rig.cd=.13;rig.heat+=7;burst(rig.x+Math.cos(rig.aim)*10,rig.y-6+Math.sin(rig.aim)*10,3,'#ffe8a0',70,.15,0,2);shake(.5);fireLaser(rig.x,rig.y-6,rig.aim,110+(upVal('cool')-1)*50,upVal('tur'),PCOL[p.slot].p,false)}}

// ===================== PLAYERS =====================
function aimVec(p,inp){if(inp.aim){const l=Math.hypot(inp.ax,inp.ay)||1;return{x:inp.ax/l,y:inp.ay/l}}const dx=(inp.held.right?1:0)-(inp.held.left?1:0),dy=(inp.held.down?1:0)-(inp.held.up?1:0);if(dx||dy){const l=Math.hypot(dx,dy);return{x:dx/l,y:dy/l}}return{x:p.face,y:0}}
const inRig=p=>p.state==='driver'||p.state==='gunner'||p.state==='rider';
function boardNew(p){if(rig.driver<0){rig.driver=p.slot;p.state='driver'}else if(rig.gunner<0){rig.gunner=p.slot;p.state='gunner'}else p.state='rider';p.x=rig.x;p.y=rig.y;p.vx=p.vy=0;p.climb=false}
function enterRig(p){if(rig.driver<0){rig.driver=p.slot;p.state='driver'}else if(rig.gunner<0){rig.gunner=p.slot;p.state='gunner'}else p.state='rider';
  while(p.carry.length&&addCargo(p.carry[0]))p.carry.shift();Snd.seat();return true}
function exitRig(p){if(p.state==='driver')rig.driver=-1;if(p.state==='gunner')rig.gunner=-1;p.state='foot';p.x=rig.x;p.y=rig.y+2;p.vx=p.vy=0;unstick(p);Snd.seat()}
function swapSeat(p){
  const who=i=>i>=0&&slots[i]&&slots[i].p?slots[i].p:null;
  if(p.state==='driver'){if(rig.gunner<0){rig.driver=-1;rig.gunner=p.slot;p.state='gunner'}else{const q=who(rig.gunner);if(!q)return;rig.driver=q.slot;rig.gunner=p.slot;q.state='driver';p.state='gunner'}Snd.seat()}
  else if(p.state==='gunner'){if(rig.driver<0){rig.gunner=-1;rig.driver=p.slot;p.state='driver'}else{const q=who(rig.driver);if(!q)return;rig.gunner=q.slot;rig.driver=p.slot;q.state='gunner';p.state='driver'}Snd.seat()}
  else if(p.state==='rider'){if(rig.driver<0){rig.driver=p.slot;p.state='driver'}else if(rig.gunner<0){rig.gunner=p.slot;p.state='gunner'}else return;Snd.seat()}
}
function doPing(p){if(p.pcd>0)return;p.pcd=1;pings.push({x:p.x,y:p.y-4,t:5,s:p.slot});Snd.ping()}
function updPlayer(s,dt){
  const p=s.p,inp=s.inp;p.flash=Math.max(0,p.flash-dt);p.inv=Math.max(0,p.inv-dt);p.pcd=Math.max(0,p.pcd-dt);p.prompt='';
  if(inRig(p)){p.x=rig.x;p.y=rig.y;p.o2=Math.min(o2Max(),p.o2+20*dt);
    if(inp.press.use)exitRig(p);else if(inp.press.item)swapSeat(p);
    if(p.state==='gunner')turret(p,inp,dt);if(inp.press.ping)doPing(p);return}
  if(p.state==='down'){p.vy=Math.min(300,p.vy+600*dt);p.vx*=.9;moveBox(p,dt);p.downT-=dt;if(p.downT<=0){p.hp=100;p.o2=o2Max();G.cash-=100;boardNew(p);ftext(p.x,p.y-12,'MEDEVAC -$100','#ffb02e')}return}
  const h=inp.held,dx=(h.right?1:0)-(h.left?1:0);
  const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS),onLad=tileAt(tx,ty)===10;
  if(onLad&&(h.up||h.down))p.climb=true;if(!onLad)p.climb=false;
  if(p.climb){p.vy=((h.down?1:0)-(h.up?1:0))*50;p.vx=dx*40;if(h.jump&&!(h.up)){p.climb=false;p.vy=-140}}
  else{p.vy=Math.min(320,p.vy+620*dt);p.vx=lerp(p.vx,dx*(p.haul?36:70),Math.min(1,(p.onGround?14:6)*dt));if(h.jump&&p.onGround&&!p.haul){p.vy=-190;Snd.jump()}}
  if(dx)p.face=dx;if(Math.abs(p.vx)>10&&p.onGround)p.anim+=dt*10;
  moveBox(p,dt);unstick(p);
  const dr=Math.hypot(p.x-rig.x,p.y-rig.y),under=p.y>(SURF+1)*TS,R=tetherR();
  if(under&&dr>R){const nx=(p.x-rig.x)/dr,ny=(p.y-rig.y)/dr,tx2=rig.x+nx*R,ty2=rig.y+ny*R;if(!boxHit(tx2,ty2,p.w,p.h)){p.x=tx2;p.y=ty2}else{p.x-=nx*30*dt;p.y-=ny*30*dt}}
  if(under&&dr>26){p.o2-=dt;if(p.o2<=0){p.o2=0;hurtPlayer(p,8*dt*3)}if(p.o2<8&&Math.random()<dt*2)Snd.beep()}else p.o2=Math.min(o2Max(),p.o2+14*dt);
  if(tileAt(tx,ty)===8)hurtPlayer(p,30*dt);
  // revive
  let dn=null;for(const o of slots)if(o.p&&o.p!==p&&o.p.state==='down'&&Math.hypot(o.p.x-p.x,o.p.y-p.y)<16)dn=o.p;
  if(dn){p.prompt='HOLD USE: REVIVE';if(h.use){p.rev+=dt/1.8;if(p.rev>=1){dn.state='foot';dn.hp=45;dn.inv=1.5;p.rev=0;Snd.revive();ftext(dn.x,dn.y-12,'REVIVED!','#7dff8a')}}else p.rev=0}
  else{p.rev=0;
    const inShop=inZone(BLD.shop,p.x,p.y)&&p.y<SURF*TS+4&&!shop.open,nearRig=Math.hypot(p.x-rig.x,p.y-rig.y)<22;
    if(p.haul){p.prompt='USE: DROP';if(inp.press.use)dropHaul(p.haul)}
    else if(inShop){p.prompt='USE: SHOP';if(inp.press.use){openShop(p)}}
    else if(nearRig){p.prompt='USE: BOARD RIG';if(inp.press.use)enterRig(p)}}
  if(inp.press.item){p.tool=(p.tool+1)%4;Snd.ui(0)}
  if(inp.press.ping)doPing(p);
  // rig transfer
  if(p.carry.length&&dr<18){p.pickT-=dt;if(p.pickT<=0){p.pickT=.15;const o=p.carry[0];if(addCargo(o)){p.carry.shift();Snd.pick(o)}}}
  // tools

function mkC(type,x,y){const D=CT[type];return{type,x,y,vx:0,vy:0,w:D.w,h:D.h,hp:D.hp,maxhp:D.hp,dir:Math.random()<.5?1:-1,t:Math.random()*5,cd:rr(1,3),flash:0,hcd:0,flee:0,seed:Math.random()*6,a2:rr(3,6),charge:0,aggro:false,onGround:false,hx:0,hy:0}}
const sol=(x,y)=>SOLID[tileAt(Math.floor(x/TS),Math.floor(y/TS))]===1;
function enemyShot(c,tg,kind,spd,dmg,n,spread){const a0=Math.atan2(tg.y-c.y,tg.x-c.x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*spread;projs.push({x:c.x,y:c.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg,kind,life:4})}}
function updC(c,dt){
  const D=CT[c.type];c.t+=dt;c.flash=Math.max(0,c.flash-dt);c.hcd=Math.max(0,c.hcd-dt);c.cd-=dt;
  let tg=null,bd=1e9;for(const o of targets()){const d=Math.hypot(o.x-c.x,o.y-c.y);if(d<bd){bd=d;tg=o}}
  if(D.boss&&bd<230)c.aggro=true;
  const sees=tg&&bd<(D.boss?(c.aggro?520:0):D.dig?220:150);
  if(D.boss&&!c.aggro){if(!D.fly){c.vy=Math.min(300,c.vy+520*dt);c.vx=0;moveBox(c,dt)}return}
  const dxT=tg?tg.x-c.x:0,dyT=tg?tg.y-c.y:0;
  if(c.charge>0){c.charge-=dt}
  if(D.dig){const sp=D.sp;if(sees){const l=Math.hypot(dxT,dyT)||1,ux=dxT/l,uy=dyT/l;c.x+=ux*sp*dt;c.y+=uy*sp*dt;c.dir=ux>=0?1:-1;
      for(const [ox,oy] of [[0,0],[ux*7,uy*7]]){const tx=Math.floor((c.x+ox)/TS),ty=Math.floor((c.y+oy)/TS);const t=tileAt(tx,ty);if(SOLID[t]&&t!==7){breakTile(tx,ty,'mob');if(Math.random()<.3)Snd.crumble()}}
      if(Math.random()<.3)burst(c.x,c.y,1,'#8a6a4a',30,.4,150)}else c.x+=Math.sin(c.t*3)*.15;
    c.y=Math.max(c.y,(SURF+2)*TS);c.x=clamp(c.x,TS*1.5,(WT-1.5)*TS)}
  else if(D.fly){
    let ax=0,ay=0;
    if(sees){const d=Math.hypot(dxT,dyT)||1;
      if(D.shoot||D.boss){const want=D.boss?80:90,k=d>want?1:-.6;ax=dxT/d*k;ay=dyT/d*k+Math.sin(c.t*2)*.4}
      else{if(c.flee>0){ax=-dxT/d;ay=-dyT/d-.2;c.flee-=dt}else{ax=dxT/d;ay=dyT/d+Math.sin(c.t*7)*.5}}
    }else{ax=Math.cos(c.t*.8+c.seed)*.5;ay=Math.sin(c.t*1.1+c.seed)*.5}
    let spd=D.sp;if(c.charge>0){const d=Math.hypot(dxT,dyT)||1;ax=dxT/d;ay=dyT/d;spd=240}
    c.vx=lerp(c.vx,ax*spd,Math.min(1,4*dt));c.vy=lerp(c.vy,ay*spd,Math.min(1,4*dt));
    if(Math.abs(c.vx)>8)c.dir=c.vx>0?1:-1;
    moveBox(c,dt);if(c.hx||c.hy){c.vx+=rr(-40,40);c.vy+=rr(-40,40)}
    if(c.y<(SURF+1)*TS)c.y=(SURF+1)*TS;
  }else{
    if(sees)c.dir=dxT>0?1:-1;else if(c.hx||!sol(c.x+c.dir*(c.w/2+3),c.y+c.h/2+3))c.dir*=-1;
    let spd=D.sp;if(D.armor&&c.type==='crawler'&&sees&&Math.abs(dyT)<24&&Math.abs(dxT)<110){if(c.charge<=0&&c.cd<=0){c.charge=.6;c.cd=4}if(c.charge>0)spd=D.sp*3.2}
    c.vx=c.dir*spd;c.vy=Math.min(300,c.vy+520*dt);
    if(c.hx&&sees&&c.onGround&&D.boss)c.vy=-210;
    moveBox(c,dt);
  }
  // attacks
  if(D.shoot&&sees&&bd<160&&c.cd<=0){c.cd=2.2;enemyShot(c,tg,'fire',95,10,1,0)}
  if(D.boss&&sees){
    if(c.cd<=0){c.cd=3.2;if(c.type==='golem')enemyShot(c,tg,'rock',105,14,3,.25);else if(c.type==='wyrm')enemyShot(c,tg,'fire',115,16,3,.2);else enemyShot(c,tg,'crystal',120,18,5,.22);Snd.roar()}
    c.a2-=dt;if(c.a2<=0){c.a2=c.type==='queen'?7:6.5;
      if(c.type==='golem'){shake(5);Snd.boom(true);burst(c.x,c.y+c.h/2,30,'#a0a7b8',120,.8,200,2);for(const o of targets())if(Math.hypot(o.x-c.x,o.y-c.y)<90){if(o===rig)hurtRig(18,'slam');else hurtPlayer(o,25)}}
      else if(c.type==='wyrm'){c.charge=.7;Snd.roar()}
      else{for(let k=0;k<2;k++)if(creatures.length<40)creatures.push(mkC('bat',c.x+rr(-16,16),c.y+rr(-10,10)));Snd.roar()}}}
  // contact
  if(c.hcd<=0)for(const o of targets()){if(Math.abs(o.x-c.x)<(o.w+c.w)/2&&Math.abs(o.y-c.y)<(o.h+c.h)/2){if(o===rig)hurtRig(D.dmg,'mob');else hurtPlayer(o,D.dmg);c.hcd=.9;if(c.type==='bat')c.flee=1;break}}
  if(tileAt(Math.floor(c.x/TS),Math.floor(c.y/TS))===8&&!D.boss&&!D.fly){c.hp-=40*dt;if(c.hp<=0)killC(c)}
}

function updProj(dt){
  for(let k=projs.length-1;k>=0;k--){const p=projs[k];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let dead=p.life<=0||sol(p.x,p.y);

function spawnLogic(dt){
  const n=nActive(),under=[rig,...slots.filter(s=>s.p&&s.p.state==='foot').map(s=>s.p)].filter(o=>o.y>(SURF+6)*TS);
  popT-=dt;
  if(popT<=0){popT=.6;for(const c of caves){if(c.pop)continue;let near=false;for(const o of targets())if(Math.hypot(o.x-c.x*TS,o.y-c.y*TS)<340)near=true;if(!near)continue;c.pop=true;const d=c.y-SURF,k=Math.random()<.65?ri(1,Math.min(4,1+Math.floor(d/120))):0;for(let i=0;i<k;i++){const tp=pickType(d);if(tp==='borer')continue;const x=c.x*TS+rr(-c.rx,c.rx)*TS*.8,y=c.y*TS;for(let t2=0;t2<8;t2++){const yy=y+t2*TS;if(!sol(x,yy)&&!sol(x,yy-TS)){const cr=mkC(tp,x,yy);if(!boxHit(cr.x,cr.y,cr.w,cr.h)){creatures.push(cr);break}}}}}}
  spawnT-=dt;if(spawnT<=0){spawnT=7/(.55+.45*n);if(!under.length)return;const cap=3+n*2;if(creatures.filter(c=>!CT[c.type].boss).length>=cap)return;
    const a=under[ri(0,under.length-1)];
    for(let tries=0;tries<14;tries++){const ang=rr(0,6.28),dist=rr(150,300),x=a.x+Math.cos(ang)*dist,y=a.y+Math.sin(ang)*dist,tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(ty<SURF+6||ty>=HT-3||tx<2||tx>WT-3)continue;
      let far=true;for(const o of targets())if(Math.hypot(o.x-x,o.y-y)<130)far=false;if(!far)continue;
      const d=ty-SURF,tp=pickType(d);
      if(tp==='borer'){if(SOLID[tileAt(tx,ty)]&&tileAt(tx,ty)!==7){creatures.push(mkC('borer',tx*TS+8,ty*TS+8));return}}
      else if(tileAt(tx,ty)===0&&!sol(x,y)){const cr=mkC(tp,tx*TS+8,ty*TS+8);if(!boxHit(cr.x,cr.y,cr.w,cr.h)){creatures.push(cr);return}}}}
}
function pickType(d){const w=[];if(d<150)w.push(['grub',6]);if(d>15)w.push(['bat',3]);if(d>50)w.push(['borer',3]);if(d>100)w.push(['crawler',3]);if(d>250)w.push(['ember',5]);let tot=0;for(const x of w)tot+=x[1];let r=Math.random()*tot;for(const x of w){r-=x[1];if(r<=0)return x[0]}return 'grub'}

    else{it.mt=0;it.vy=Math.min(300,it.vy+300*dt);it.vx*=.98;moveBox(it,dt);if(it.hy>0){it.vy=-it.iy*.3;if(Math.abs(it.vy)<20)it.vy=0}if(it.hx)it.vx=-it.ix*.4}

function updPlay(dt){
  if(!G.order)newOrder();G.playtime+=dt;if(G.cash<0)G.cash*=Math.pow(1.01,dt/60);
  tryJoin();syncPlayers();
  if(kp('Escape')||padNav.start){screen='pause';menu.sel=0;save();Snd.engine(false,0,false,0);return}
  hintT+=dt;
  for(const s of slots)if(s.active&&s.p)updPlayer(s,dt);
  updShop(dt);updRig(dt);updZones(dt);updCreatures(dt);updProj(dt);updItems(dt);updFalling(dt);updBooms(dt);updFx(dt);spawnLogic(dt);
  G.record=Math.max(G.record,Math.floor(depthRows()));checkMiles();updWarn(dt);if(mileB){mileB.t-=dt;if(mileB.t<=0)mileB=null}updCam(dt);
  saveT+=dt;if(saveT>15){saveT=0;save()}
}
function step(dt){
  buildNav();
  if(screen==='title')updTitle();
  else if(screen==='keys')updKeys();
  else if(screen==='options'){runMenu(optItems());if(nav.back){screen=backTo;menu.sel=0}}
  else if(screen==='help'){
    if(nav.back||backHit()){screen=backTo;menu.sel=0;helpPage=0}
    else if(nav.left&&helpPage>0)helpPage--;
    else if(nav.right||nav.ok||mouse.click){if(helpPage<1)helpPage++;else{screen=backTo;menu.sel=0;helpPage=0}}}
  else if(screen==='pause')updPause();
  else updPlay(dt);
}
